name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "1.8.4"
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run pytest

  deploy:
    # Only after test passes, and only for a real push to main (never for a
    # pull_request event, and never for a push to any other branch) -- this
    # is what turns a merge (including from the GitHub mobile app) into the
    # entire deploy process: no SSH/server access needed for routine changes.
    # See deploy/p-trade-live.service and this repo's history for why the
    # VPS, not GitHub Actions itself, runs the live pipeline (a stable
    # outbound IP SEBI requires for order placement, and a real crontab
    # instead of GitHub's unreliable schedule trigger -- see
    # hourly-signals.yml's own docstring).
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code and restart services on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/p-trade
            git pull origin main --ff-only
            # Phase 19 (projectedPlann.md, docs/decisions/): a PR adding a
            # new dependency used to need a separate, easy-to-forget manual
            # venv update on the VPS -- poetry-core is the declared build
            # backend (see pyproject.toml's [build-system]), so pip can
            # resolve/install straight from pyproject.toml without poetry
            # itself being installed on the VPS. Quiet and idempotent: a
            # no-op whenever dependencies haven't actually changed.
            .venv/bin/pip install -q -e .
            systemctl restart p-trade-live
            systemctl restart p-trade-dashboard
            # Phase 19: fail the deploy (not just log a warning) if either
            # service doesn't come up healthy, instead of finding out later
            # from a missed heartbeat/silent gap -- give each a moment past
            # the restart before checking, same margin systemd itself needs
            # to report a genuine crash-on-start rather than "activating".
            sleep 5
            for service in p-trade-live p-trade-dashboard; do
              if [ "$(systemctl is-active "$service")" != "active" ]; then
                echo "$service is not active after restart -- deploy failed." >&2
                systemctl status "$service" --no-pager || true
                exit 1
              fi
            done
