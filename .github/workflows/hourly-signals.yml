name: Hourly Signal Pipeline

# DISABLED (schedule trigger removed): this pipeline now runs from a real
# crontab on a dedicated VPS instead -- GitHub Actions' own scheduler proved
# unreliable (dropped/delayed runs, see project history), and a VPS also
# gives the static outbound IP SEBI requires for API order placement. Kept
# as workflow_dispatch-only so it can still be triggered manually if the VPS
# is ever down. Do not re-enable the schedule trigger without also disabling
# the VPS crontab first -- both running at once caused duplicate/overlapping
# writes that corrupted trade data (see the timestamp-timezone incident).
on:
  workflow_dispatch: {}

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "1.8.4"
      - run: poetry install --no-interaction
      - run: poetry run python -m trading_scanner.signals
        env:
          TRADING_SCANNER_TURSO_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TRADING_SCANNER_TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TRADING_SCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TRADING_SCANNER_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
